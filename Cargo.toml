[package]
name = "herdr-oc-quota"
version = "0.1.1"
edition = "2021"
description = "GLM / Z.AI Coding Plan quota indicator for the Herdr tab bar"
authors = ["Umar Alfarouk <medrivia@gmail.com>"]
license = "MIT"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = true }

[profile.release]
strip = true
lto = true
